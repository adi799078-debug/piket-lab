<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Piket Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; padding-bottom: 50px; }
        .nav-pills { margin-bottom: 20px; background: white; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #loading, #loadingData { display: none; }
        .img-preview { width: 50px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container mt-4">
    <!-- Navigasi Tab -->
    <ul class="nav nav-pills nav-fill" id="pills-tab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="tab-form" data-bs-toggle="pill" data-bs-target="#content-form">📝 Isi Laporan</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="tab-data" data-bs-toggle="pill" data-bs-target="#content-data" onclick="muatData()">📊 Cek Data</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- HALAMAN FORMULIR -->
        <div class="tab-pane fade show active" id="content-form">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card p-4">
                        <h4 class="text-center mb-4">Laporan Piket</h4>
                        <form id="piketForm">
                            <div class="mb-3"><label class="form-label">Nama Siswa</label><input type="text" name="nama" class="form-control" required></div>
                            <div class="mb-3">
                                <label class="form-label">Tugas</label>
                                <select name="bagian" class="form-select" required>
                                    <option value="Menyapu">Menyapu</option>
                                    <option value="Merapikan Meja">Merapikan Meja</option>
                                    <option value="Mematikan Alat">Mematikan Alat</option>
                                </select>
                            </div>
                            <div class="mb-3"><label class="form-label">Foto Bukti</label><input type="file" id="foto" class="form-control" accept="image/*" capture="camera" required></div>
                            <div class="mb-3"><label class="form-label">Catatan</label><textarea name="catatan" class="form-control"></textarea></div>
                            <button type="submit" id="submitBtn" class="btn btn-primary w-100">Kirim Laporan</button>
                        </form>
                        <div id="loading" class="text-center mt-3"><div class="spinner-border text-primary"></div><p>Mengirim...</p></div>
                        <div id="status" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HALAMAN TABEL DATA -->
        <div class="tab-pane fade" id="content-data">
            <div class="card p-4">
                <h4 class="text-center mb-4">Daftar Piket Selesai</h4>
                <div id="loadingData" class="text-center"><div class="spinner-border text-primary"></div></div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>No</th><th>Nama</th><th>Tugas</th><th>Waktu</th><th>Foto</th>
                            </tr>
                        </thead>
                        <tbody id="tabelBody">
                            <!-- Data akan muncul di sini -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const scriptURL = 'URL_WEB_APP_ANDA'; // Ganti dengan URL Web App Anda

    // FUNGSI KIRIM DATA
    const form = document.getElementById('piketForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('loading').style.display = 'block';
        const file = document.getElementById('foto').files[0];
        const reader = new FileReader();
        reader.onload = function() {
            const data = {
                nama: form.nama.value,
                bagian: form.bagian.value,
                catatan: form.catatan.value,
                file: reader.result.split(',')[1],
                mimeType: file.type
            };
            fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
            .then(() => { 
                document.getElementById('loading').style.display = 'none';
                alert('Berhasil!'); 
                form.reset(); 
            });
        };
        reader.readAsDataURL(file);
    });

    // FUNGSI AMBIL DATA
    function muatData() {
        const tbody = document.getElementById('tabelBody');
        const loader = document.getElementById('loadingData');
        tbody.innerHTML = '';
        loader.style.display = 'block';

        fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
            loader.style.display = 'none';
            data.reverse().forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[4]}</td>
                    <td><a href="${row[3]}" target="_blank" class="btn btn-sm btn-outline-info">Lihat Foto</a></td>
                `;
                tbody.appendChild(tr);
            });
        });
    }
</script>
</body>
</html>
