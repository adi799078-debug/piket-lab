<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Piket Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; padding: 20px 0; font-family: sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header-box { background: #007bff; color: white; padding: 20px; border-radius: 15px 15px 0 0; margin: -25px -25px 25px -25px; }
        #loading { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-sm-12">
            <div class="card p-4">
                <div class="header-box text-center">
                    <h4 class="mb-0">🧹 Laporan Piket Lab</h4>
                </div>
                <form id="piketForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nama Siswa</label>
                        <input type="text" name="nama" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Bagian Piket</label>
                        <select name="bagian" class="form-select" required>
                            <option value="">-- Pilih Tugas --</option>
                            <option value="Menyapu & Mengepel">Menyapu & Mengepel</option>
                            <option value="Merapikan Kursi & Meja">Merapikan Kursi & Meja</option>
                            <option value="Mematikan AC & Lampu">Mematikan AC & Lampu</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Catatan</label>
                        <textarea name="catatan" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Ambil Foto Bukti</label>
                        <input type="file" id="foto" class="form-control" accept="image/*" capture="camera" required>
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary w-100">KIRIM LAPORAN</button>
                </form>
                <div id="loading" class="text-center mt-3">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Sedang mengirim...</p>
                </div>
                <div id="status" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
<script>
    // MASUKKAN URL GOOGLE WEB APP ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxu7OriR3Dnp88cBqD6mjWfZE6gjdgv8gjGW7TydyLffrNk_BIBrarNdM18TzDEQJk1Kg/exec';

    const form = document.getElementById('piketForm');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        loading.style.display = 'block';
        btn.disabled = true;
        const fileInput = document.getElementById('foto');
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function() {
            const base64Data = reader.result.split(',')[1];
            const data = {
                nama: form.nama.value,
                bagian: form.bagian.value,
                catatan: form.catatan.value,
                file: base64Data,
                mimeType: file.type
            };
            fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(response => {
                loading.style.display = 'none';
                btn.disabled = false;
                if(response.result === 'success') {
                    status.innerHTML = '<div class="alert alert-success">Berhasil Terkirim!</div>';
                    form.reset();
                }
            })
            .catch(error => {
                loading.style.display = 'none';
                btn.disabled = false;
                status.innerHTML = '<div class="alert alert-danger">Error!</div>';
            });
        };
        reader.readAsDataURL(file);
    });
</script>
</body>
</html>
