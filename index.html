<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Piket Tanpa Excel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-pills .nav-link.active { background-color: #198754; }
        #loader { display: none; }
    </style>
</head>
<body>

<div class="container mt-4">
    <ul class="nav nav-pills nav-fill mb-4" id="pills-tab">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#form">📝 Kirim</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#list" onclick="muatData()">📊 Riwayat</button></li>
    </ul>

    <div class="tab-content">
        <!-- FORMULIR -->
        <div class="tab-pane fade show active" id="form">
            <div class="card p-4 mx-auto" style="max-width: 500px;">
                <form id="pForm">
                    <div class="mb-3"><label>Nama</label><input type="text" id="n" class="form-control" required></div>
                    <div class="mb-3"><label>Tugas</label><select id="t" class="form-select"><option>Menyapu</option><option>Merapikan Meja</option></select></div>
                    <div class="mb-3"><label>Catatan</label><input type="text" id="c" class="form-control"></div>
                    <div class="mb-3"><label>Foto</label><input type="file" id="f" class="form-control" accept="image/*" capture="camera" required></div>
                    <button type="submit" id="btn" class="btn btn-success w-100">Kirim Laporan</button>
                </form>
                <div id="msg" class="mt-3"></div>
            </div>
        </div>

        <!-- RIWAYAT (AMBIL DARI DRIVE) -->
        <div class="tab-pane fade" id="list">
            <div class="card p-3">
                <div id="loader" class="text-center"><div class="spinner-border text-success"></div></div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Waktu</th><th>Nama</th><th>Tugas</th><th>Foto</th></tr></thead>
                        <tbody id="tBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const url = 'URL_WEB_APP_ANDA'; 

    // KIRIM DATA
    const f = document.getElementById('pForm');
    f.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('btn').disabled = true;
        const file = document.getElementById('f').files[0];
        const r = new FileReader();
        r.onload = function() {
            const d = {
                nama: document.getElementById('n').value,
                bagian: document.getElementById('t').value,
                catatan: document.getElementById('c').value,
                file: r.result.split(',')[1],
                mimeType: file.type
            };
            fetch(url, { method: 'POST', body: JSON.stringify(d) })
            .then(() => { alert('Terkirim!'); location.reload(); });
        };
        r.readAsDataURL(file);
    });

    // MUAT DATA DARI DAFTAR FILE DRIVE
    function muatData() {
        const b = document.getElementById('tBody');
        document.getElementById('loader').style.display = 'block';
        b.innerHTML = '';
        fetch(url).then(res => res.json()).then(data => {
            document.getElementById('loader').style.display = 'none';
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><small>${item.waktu}</small></td><td>${item.nama}</td><td>${item.tugas}</td>
                                <td><a href="${item.url}" target="_blank" class="btn btn-sm btn-success">Lihat</a></td>`;
                b.appendChild(tr);
            });
        });
    }
</script>
</body>
</html>
