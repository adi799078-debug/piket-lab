<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Piket Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding-bottom: 50px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-pills .nav-link.active { background-color: #198754; font-weight: bold; }
        .nav-link { color: #198754; }
        #loader { display: none; }
        .header-title { color: #198754; font-weight: bold; text-align: center; margin-bottom: 20px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="header-title">🧹 Monitoring Piket Lab</h2>

    <!-- Navigasi Tab -->
    <ul class="nav nav-pills nav-fill mb-4" id="pills-tab">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#form">📝 Kirim Laporan</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#list" onclick="muatData()">📊 Riwayat</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- HALAMAN FORMULIR -->
        <div class="tab-pane fade show active" id="form">
            <div class="card p-4 mx-auto" style="max-width: 500px;">
                <form id="pForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nama Siswa</label>
                        <input type="text" id="n" class="form-control" placeholder="Tulis nama lengkap" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tugas Piket</label>
                        <select id="t" class="form-select" required>
                            <option value="">-- Pilih Tugas --</option>
                            <option>Menyapu & Mengepel</option>
                            <option>Merapikan Meja & Kursi</option>
                            <option>Mematikan AC, Lampu & PC</option>
                            <option>Membersihkan Kaca/Debu</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Catatan Singkat</label>
                        <input type="text" id="c" class="form-control" placeholder="Contoh: Aman, lab sudah dikunci">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Foto Bukti</label>
                        <input type="file" id="f" class="form-control" accept="image/*" capture="camera" required>
                    </div>
                    <button type="submit" id="btn" class="btn btn-success w-100 fw-bold">KIRIM LAPORAN</button>
                </form>
                <div id="msg" class="mt-3 text-center"></div>
            </div>
        </div>

        <!-- HALAMAN RIWAYAT -->
        <div class="tab-pane fade" id="list">
            <div class="card p-3 shadow">
                <h5 class="text-center mb-3">Daftar Laporan Terkini</h5>
                <div id="loader" class="text-center">
                    <div class="spinner-border text-success"></div>
                    <p>Memuat riwayat dari Google Sheets...</p>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle table-striped">
                        <thead class="table-success">
                            <tr>
                                <th>Waktu</th>
                                <th>Nama</th>
                                <th>Tugas</th>
                                <th>Bukti</th>
                            </tr>
                        </thead>
                        <tbody id="tBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // URL Web App yang baru saja Anda salin
    const url = 'https://script.google.com/macros/s/AKfycbxu7OriR3Dnp88cBqD6mjWfZE6gjdgv8gjGW7TydyLffrNk_BIBrarNdM18TzDEQJk1Kg/exec'; 

    const pForm = document.getElementById('pForm');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    // 1. FUNGSI KIRIM DATA
    pForm.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = "Sedang Mengirim...";
        msg.innerHTML = "";

        const file = document.getElementById('f').files[0];
        const reader = new FileReader();

        reader.onload = function() {
            const data = {
                nama: document.getElementById('n').value,
                bagian: document.getElementById('t').value,
                catatan: document.getElementById('c').value || "-",
                file: reader.result.split(',')[1],
                mimeType: file.type
            };

            fetch(url, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => {
                btn.disabled = false;
                btn.innerText = "Kirim Laporan";
                if(res.result === 'success') {
                    alert('✅ Berhasil Terkirim!');
                    location.reload();
                } else {
                    msg.innerHTML = '<div class="alert alert-danger text-start">Gagal: ' + res.error + '</div>';
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerText = "Kirim Laporan";
                msg.innerHTML = '<div class="alert alert-danger text-start">Terjadi kesalahan jaringan. Pastikan akun tidak dibatasi.</div>';
            });
        };
        reader.readAsDataURL(file);
    });

    // 2. FUNGSI MUAT RIWAYAT
    function muatData() {
        const body = document.getElementById('tBody');
        const loader = document.getElementById('loader');
        body.innerHTML = '';
        loader.style.display = 'block';

        fetch(url)
        .then(res => res.json())
        .then(data => {
            loader.style.display = 'none';
            if(!data || data.length === 0) {
                body.innerHTML = '<tr><td colspan="4" class="text-center">Belum ada data di Google Sheets.</td></tr>';
                return;
            }
            
            data.reverse().forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><small>${item.waktu}</small></td>
                    <td><b>${item.nama}</b></td>
                    <td>${item.tugas}</td>
                    <td><a href="${item.foto}" target="_blank" class="btn btn-sm btn-outline-success">Lihat Foto</a></td>
                `;
                body.appendChild(tr);
            });
        })
        .catch(err => {
            loader.style.display = 'none';
            body.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Gagal memuat data. Periksa izin akses folder/sheet.</td></tr>';
        });
    }
</script>
</body>
</html>
